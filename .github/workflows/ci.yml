name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t diabetescheck .
      - name: Run container and check it responds
        run: |
          docker run -d -p 8080:5000 --name app diabetescheck
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/
      - name: Show container logs on failure
        if: failure()
        run: docker logs app